
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNS横断検索</title>
<style>
body {
  background: #121212;
  color: white;
  font-family: sans-serif;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}
h1 {
  text-align: center;
  font-size: 26px;
}
input, select, button {
  width: 100%;
  padding: 15px;
  margin: 8px 0 18px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  box-sizing: border-box;
}
input, select {
  background: #292929;
  color: white;
}
button {
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
label {
  font-size: 15px;
}
</style>
</head>
<body>

<h1>SNS横断検索</h1>

<label for="name">名前</label>
<input id="name" placeholder="名前を入力">

<label for="keyword">追加キーワード（任意）</label>
<input id="keyword" placeholder="検索したいキーワードを入力">

<label for="site">検索対象サイト</label>
<select id="site">
<option value="all">全サイト</option>
<option value="instagram.com">Instagram</option>
<option value="facebook.com">Facebook</option>
<option value="x.com">X</option>
<option value="tiktok.com">TikTok</option>
<option value="youtube.com">YouTube</option>
<option value="vimeo.com">Vimeo</option>
<option value="dailymotion.com">Dailymotion</option>
<option value="pinterest.com">Pinterest</option>
<option value="nicovideo.jp">ニコニコ動画</option>
</select>

<button onclick="search('all')">一括検索</button>
<button onclick="search('image')">写真検索</button>
<button onclick="search('video')">動画検索</button>

<script>
function search(type) {
  const name = document.getElementById('name').value.trim();
  const keyword = document.getElementById('keyword').value.trim();
  const site = document.getElementById('site').value;

  if (!name) {
    alert('名前を入力してください');
    return;
  }

  const sites = [
    'instagram.com',
    'facebook.com',
    'x.com',
    'tiktok.com',
    'youtube.com',
    'vimeo.com',
    'dailymotion.com',
    'pinterest.com',
    'nicovideo.jp'
  ];

  let query = '"' + name + '"';

  if (keyword) {
    query += ' ' + keyword;
  }

  if (site === 'all') {
    query += ' (' + sites.map(s => 'site:' + s).join(' OR ') + ')';
  } else {
    query += ' site:' + site;
  }

  let url = 'https://www.google.com/search?q='
    + encodeURIComponent(query);

  if (type === 'image') url += '&tbm=isch';
  if (type === 'video') url += '&tbm=vid';

window.location.href = url + '&tbs=li:1';
}
</script>

</body>
</html>
