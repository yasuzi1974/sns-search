
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNS横断検索</title>
<style>
body {
  background: #121212;
  color: white;
  font-family: sans-serif;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}
h1 {
  text-align: center;
  font-size: 26px;
}
input, select, button {
  width: 100%;
  padding: 15px;
  margin: 8px 0 18px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  box-sizing: border-box;
}
input, select {
  background: #292929;
  color: white;
}
button {
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
label {
  font-size: 15px;
}
details {
  background: #202020;
  padding: 16px;
  border-radius: 10px;
  margin-top: 20px;
}
summary {
  cursor: pointer;
  font-weight: bold;
}
.site-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid #444;
  padding: 8px 0;
}
.site-row span {
  overflow-wrap: anywhere;
}
.delete {
  background: #a83232;
  width: auto;
  padding: 8px 12px;
  margin: 0;
}
.add {
  background: #16834a;
}
</style>
</head>
<body>

<h1>SNS横断検索</h1>

<label for="name">名前</label>
<input id="name" placeholder="名前を入力">

<label for="keyword">追加キーワード（任意）</label>
<input id="keyword" placeholder="検索したいキーワードを入力">

<label for="site">検索対象サイト</label>
<select id="site"></select>

<button onclick="search('all')">一括検索</button>
<button onclick="search('image')">写真検索</button>
<button onclick="search('video')">動画検索</button>

<details>
<summary>⚙ 検索サイトの追加・削除</summary>

<div id="siteList"></div>

<br>

<label for="newSite">追加したいサイトのURL</label>
<input id="newSite" placeholder="https://example.com">

<button class="add" onclick="addSite()">＋ サイトを追加</button>

<button onclick="resetSites()">初期設定に戻す</button>
</details>

<script>
const defaults = [
  'instagram.com',
  'facebook.com',
  'x.com',
  'tiktok.com',
  'youtube.com',
  'vimeo.com',
  'dailymotion.com',
  'pinterest.com',
  'nicovideo.jp'
];

let sites = [...defaults];

try {
  const saved = JSON.parse(localStorage.getItem('snsSites'));
  if (Array.isArray(saved)) {
    sites = saved;
  }
} catch (e) {}

function saveSites() {
  try {
    localStorage.setItem('snsSites', JSON.stringify(sites));
  } catch (e) {
    alert('サイトの自動保存ができませんでした');
  }
  renderSites();
}

function renderSites() {
  const select = document.getElementById('site');
  const list = document.getElementById('siteList');
  const previous = select.value;

  select.replaceChildren();
  list.replaceChildren();

  select.add(new Option('全サイト', 'all'));

  sites.forEach((site, index) => {
    select.add(new Option(site, site));

    const row = document.createElement('div');
    row.className = 'site-row';

    const label = document.createElement('span');
    label.textContent = site;

    const button = document.createElement('button');
    button.textContent = '削除';
    button.className = 'delete';
    button.onclick = () => deleteSite(index);

    row.append(label, button);
    list.appendChild(row);
  });

  select.value = sites.includes(previous) ? previous : 'all';
}

function addSite() {
  const input = document.getElementById('newSite');
  let value = input.value.trim();

  if (!value) {
    alert('サイトのURLを入力してください');
    return;
  }

  try {
    if (!/^https?:\/\//i.test(value)) {
      value = 'https://' + value;
    }

    const parsed = new URL(value);
    value = parsed.hostname.toLowerCase().replace(/^www\./, '');

    if (!/^[a-z0-9.-]+\.[a-z0-9-]+$/.test(value)) {
      throw new Error('invalid');
    }
  } catch (e) {
    alert('正しいサイトのURLを入力してください');
    return;
  }

  if (sites.includes(value)) {
    alert('すでに登録されています');
    return;
  }

  sites.push(value);
  saveSites();
  input.value = '';
}

function deleteSite(index) {
  if (confirm(sites[index] + ' を削除しますか？')) {
    sites.splice(index, 1);
    saveSites();
  }
}

function resetSites() {
  if (confirm('最初の9サイトに戻しますか？')) {
    sites = [...defaults];
    saveSites();
  }
}

function search(type) {
  const name = document.getElementById('name').value.trim();
  const keyword = document.getElementById('keyword').value.trim();
  const site = document.getElementById('site').value;

  if (!name) {
    alert('名前を入力してください');
    return;
  }

  if (sites.length === 0) {
    alert('検索サイトを追加してください');
    return;
  }

  let query = '"' + name.replace(/"/g, '') + '"';

  if (keyword) {
    query += ' ' + keyword;
  }

  if (site === 'all') {
    query += ' (' + sites.map(s => 'site:' + s).join(' OR ') + ')';
  } else {
    query += ' site:' + site;
  }

  let url = 'https://www.google.com/search?q='
    + encodeURIComponent(query);

  if (type === 'image') url += '&tbm=isch';
  if (type === 'video') url += '&tbm=vid';

  window.location.href = url + '&tbs=li:1';
}

renderSites();
</script>

<script>
const panel = document.createElement('div');
panel.innerHTML = `
<button id="backup">登録サイトをバックアップ</button>
<button id="restore">登録サイトを復元</button>
<textarea id="backupText" style="width:100%;box-sizing:border-box;min-height:100px" placeholder="バックアップデータ"></textarea>
<p id="saveStatus"></p>`;
document.querySelector('details').appendChild(panel);

document.getElementById('backup').onclick = () => {
  document.getElementById('backupText').value = JSON.stringify(sites);
};

document.getElementById('restore').onclick = () => {
  try {
    const data = JSON.parse(document.getElementById('backupText').value);
    if (!Array.isArray(data) || !data.every(s =>
      typeof s === 'string' && /^[a-z0-9.-]+\.[a-z0-9-]+$/.test(s)
    )) throw new Error();
    if (!confirm('登録サイトを復元しますか？')) return;
    sites = [...new Set(data)];
    saveSites();
  } catch {
    alert('バックアップデータが正しくありません');
  }
};

saveSites = function() {
  try {
    localStorage.setItem('snsSites', JSON.stringify(sites));
    document.getElementById('saveStatus').textContent = '保存完了';
  } catch {
    document.getElementById('saveStatus').textContent = '保存失敗';
  }
  renderSites();
};
</script>

</body>
</html>
